<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>集まれ仕様書の森</title>
    <style>
        :root {
            --bg: #f3f7ee;
            --panel: #ffffff;
            --forest: #234d3a;
            --forest-soft: #5d8a6a;
            --pine: #1e5e42;
            --text: #1f2d24;
            --muted: #5a685f;
            --line: rgba(35, 77, 58, 0.12);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
            background: linear-gradient(180deg, #f8fbf6 0%, var(--bg) 100%);
            color: var(--text);
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 80px 24px 120px;
        }

        .eyebrow {
            display: inline-block;
            margin: 0 0 18px;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(30, 94, 66, 0.08);
            color: var(--pine);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.6rem, 5vw, 5rem);
            line-height: 1.08;
            letter-spacing: -0.04em;
            color: var(--forest);
        }

        .lead {
            max-width: 700px;
            margin-top: 20px;
            font-size: clamp(1.05rem, 2vw, 1.35rem);
            line-height: 1.7;
            color: var(--muted);
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 48px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(28, 48, 36, 0.04);
        }

        .card h2 {
            margin: 0 0 12px;
            font-size: 1.15rem;
            color: var(--forest);
        }

        .card p {
            margin: 0;
            line-height: 1.75;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <main class="container">
        <p class="eyebrow">仕様書 × コミュニティ</p>
        <h1>集まれ仕様書の森</h1>
        <p class="lead">
            知識が散らばる現場に、仕様書を育てる場所をつくる。
            要件、設計、運用の知見を集めて、森のように育っていく情報基盤を目指します。
        </p>

        <section class="cards" aria-label="サイトの特徴">
            <article class="card">
                <h2>集める</h2>
                <p>文書化されていない知識を拾い、共通の土台として整理していく。</p>
            </article>
            <article class="card">
                <h2>つながる</h2>
                <p>チームと情報がつながり、問い・判断・仕組みが一緒に育つ場所をつくる。</p>
            </article>
            <article class="card">
                <h2>育てる</h2>
                <p>仕様書は一度で完了ではなく、更新と共有を続けて森を深くしていく。</p>
            </article>
        </section>
    </main>
</body>
</html>
